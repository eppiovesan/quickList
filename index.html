<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickList</title>
    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

</head>
<body>
    <main>
        <div id="title">
            <img src="assets/logo.jpg">
            <p id="appName"> quicklist </p>
        </div>

    
        
        <button id="btnVoltar" class="btnSemFormatacao"> <- Voltar </button>
        <h1> Compras da semana </h1>

        <form>
            <input id="inputDescriptionItem" type="text" placeholder="Adicione um novo item"> 
            <button id = "btnAdicionar"> Adicionar item</button>        
        </form>

        <ul>

        </ul>

        <div class="alert">
            <button class="btnSemFormatacao" id="btnAlert"></button> 
            <p id="txtAlert">O item foi removido da lista </p>
            <button class="btnSemFormatacao" id="btnFecharAlert"></button> 
        </div>

    </main>


<script src="script.js"></script>
    
</body>
</html>
